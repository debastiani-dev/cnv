name: Deploy CNV

on:
  push:
    branches: [ "main", "develop" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Determine Target Environment
      - name: Set Deployment Target
        id: target
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "TARGET_SERVICE=web_prod" >> $GITHUB_ENV
          else
            echo "TARGET_SERVICE=web_staging" >> $GITHUB_ENV
          fi

      - name: Copy Files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "."
          target: "/var/www/cnv"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          TARGET_SERVICE: ${{ env.TARGET_SERVICE }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: TARGET_SERVICE
          timeout: 60s
          command_timeout: 30m
          script: |
            cd /var/www/cnv
            
            # --- 2. Regenerate Env Files (Security) ---
            # Production
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" > .env.prod
            echo "DB_HOST=db_prod" >> .env.prod
            echo "DB_NAME=cnv_prod" >> .env.prod
            echo "DEBUG=False" >> .env.prod
            echo "ALLOWED_HOSTS=neloredovale.com.br,www.neloredovale.com.br" >> .env.prod
            echo "CSRF_TRUSTED_ORIGINS=https://neloredovale.com.br,https://www.neloredovale.com.br" >> .env.prod
            echo "SECRET_KEY=${{ secrets.PROD_SECRET_KEY }}" >> .env.prod
            
            # Staging
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" > .env.staging
            echo "DB_HOST=db_staging" >> .env.staging
            echo "DB_NAME=cnv_staging" >> .env.staging
            echo "DEBUG=True" >> .env.staging
            echo "ALLOWED_HOSTS=staging.neloredovale.com.br" >> .env.staging
            echo "CSRF_TRUSTED_ORIGINS=https://staging.neloredovale.com.br" >> .env.staging
            echo "SECRET_KEY=${{ secrets.STAGING_SECRET_KEY }}" >> .env.staging

            # --- 3. Deploy & Migrate ---
            echo "Starting deployment for: $TARGET_SERVICE"
            
            # Ensure Nginx is running (Critical for SSL)
            docker compose -f docker-compose.prod.yml up -d nginx

            # Rebuild ONLY the target environment
            docker compose -f docker-compose.prod.yml up -d --build --force-recreate $TARGET_SERVICE
            
            # Run Database Migrations Automatically
            echo "Applying migrations..."
            docker compose -f docker-compose.prod.yml exec -t $TARGET_SERVICE python manage.py migrate --noinput
            
            # Reload Nginx to capture new container IPs
            docker compose -f docker-compose.prod.yml exec nginx nginx -s reload

            # Cleanup old images to save disk space
            docker image prune -f