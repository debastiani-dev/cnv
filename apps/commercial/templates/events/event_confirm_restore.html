{% extends "layouts/base_dashboard.html" %}
{% load i18n %}

{% block title %}{% trans "Restore Event" %}{% endblock %}

{% block content %}
<div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="bg-white px-6 py-8 shadow sm:rounded-lg">
        <h3 class="text-base font-semibold leading-6 text-gray-900">{% trans "Restore Event" %}</h3>
        <div class="mt-2">
            <p class="text-sm text-gray-500">
                {% trans "Are you sure you want to restore the event" %} <strong>{{ object.name }}</strong>?
            </p>
        </div>
        <form method="post" class="mt-5 sm:flex sm:flex-row-reverse">
            {% csrf_token %}
            <button type="submit" class="inline-flex w-full justify-center rounded-md bg-indigo-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 sm:ml-3 sm:w-auto">{% trans "Restore" %}</button>
            <a href="{% url 'commercial:event_trash' %}" class="mt-3 inline-flex w-full justify-center rounded-md bg-white px-3 py-2 text-sm font-semibold text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 hover:bg-gray-50 sm:mt-0 sm:w-auto">{% trans "Cancel" %}</a>
        </form>
    </div>
</div>
{% endblock %}
