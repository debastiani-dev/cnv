services:
  # --- PRODUCTION ---
  web_prod:
    build: .
    restart: always
    # Run collectstatic on boot to update the volume with new files
    command: sh -c "python manage.py collectstatic --noinput && gunicorn core.wsgi:application --bind 0.0.0.0:8000"
    env_file: .env.prod
    volumes:
      - static_prod:/app/staticfiles
      - media_prod:/app/media
    depends_on:
      - db_prod
      - redis

  db_prod:
    image: postgres:15
    restart: always
    volumes:
      - pg_data_prod:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=cnv_prod
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}

  # --- STAGING ---
  web_staging:
    build: .
    restart: always
    # FIX: Run collectstatic here too (Note the port is 8001)
    command: sh -c "python manage.py collectstatic --noinput && gunicorn core.wsgi:application --bind 0.0.0.0:8001"
    env_file: .env.staging
    volumes:
      - static_staging:/app/staticfiles
      - media_staging:/app/media
    depends_on:
      - db_staging
      - redis

  db_staging:
    image: postgres:15
    restart: always
    volumes:
      - pg_data_staging:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=cnv_staging
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}

  # --- INFRASTRUCTURE ---
  redis:
    image: redis:7-alpine
    restart: always

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - static_prod:/var/www/prod/static
      - media_prod:/var/www/prod/media
      - static_staging:/var/www/staging/static
      - media_staging:/var/www/staging/media
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - web_prod
      - web_staging

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

volumes:
  pg_data_prod:
  pg_data_staging:
  static_prod:
  media_prod:
  static_staging:
  media_staging:
