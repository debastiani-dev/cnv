server {
    listen 80;
    server_name neloredovale.com.br www.neloredovale.com.br staging.neloredovale.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 "Waiting for SSL...";
        add_header Content-Type text/plain;
    }
}