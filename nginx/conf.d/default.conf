# --- PRODUCTION ---
server {
    listen 80;
    server_name neloredovale.com.br www.neloredovale.com.br;
    
    # Allow Certbot to verify domain
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everyone to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name neloredovale.com.br www.neloredovale.com.br;

    # SSL Certs (We just generated these!)
    ssl_certificate /etc/letsencrypt/live/neloredovale.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/neloredovale.com.br/privkey.pem;

    # Security Tweaks
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://web_prod:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /var/www/prod/static/;
    }
    location /media/ {
        alias /var/www/prod/media/;
    }
}

# --- STAGING ---
server {
    listen 80;
    server_name staging.neloredovale.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name staging.neloredovale.com.br;

    ssl_certificate /etc/letsencrypt/live/staging.neloredovale.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.neloredovale.com.br/privkey.pem;

    location / {
        proxy_pass http://web_staging:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /var/www/staging/static/;
    }
    location /media/ {
        alias /var/www/staging/media/;
    }
}